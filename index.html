<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Steal a Squishy 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
canvas{display:block}

#ui{
position:fixed;
top:0;
left:0;
width:100%;
z-index:10;
pointer-events:none;
}

#top{
display:flex;
gap:8px;
padding:12px;
}

.pill{
background:#151923dd;
color:white;
padding:10px 14px;
border-radius:14px;
font-weight:bold;
}

button{
border:0;
border-radius:14px;
font-weight:bold;
padding:10px 14px;
}

#lock{
pointer-events:auto;
background:#151923;
color:white;
}

#msg{
position:absolute;
top:65px;
left:50%;
transform:translateX(-50%);
background:#151923ee;
color:white;
padding:10px 15px;
border-radius:12px;
opacity:0;
transition:.2s;
white-space:nowrap;
}

#msg.show{opacity:1}

#hint{
position:fixed;
top:58%;
left:50%;
transform:translateX(-50%);
background:#111d;
color:white;
padding:10px 15px;
border-radius:12px;
display:none;
z-index:12;
font-weight:bold;
}

#controls{
position:fixed;
inset:0;
z-index:20;
pointer-events:none;
}

#joystick{
position:absolute;
left:20px;
bottom:25px;
width:125px;
height:125px;
border-radius:50%;
background:#ffffff30;
border:2px solid #ffffff70;
pointer-events:auto;
}

#stick{
position:absolute;
width:58px;
height:58px;
left:31px;
top:31px;
border-radius:50%;
background:#ffffff70;
}

#buttons{
position:absolute;
right:18px;
bottom:20px;
display:flex;
flex-direction:column;
gap:10px;
}

#buttons button{
width:65px;
height:65px;
font-size:25px;
pointer-events:auto;
background:#ffffffdd;
}

#help{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
background:#0008;
color:white;
padding:6px 10px;
border-radius:8px;
font-size:12px;
z-index:15;
}

.panel{
position:fixed;
z-index:50;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:92%;
max-width:500px;
max-height:80%;
overflow:auto;
background:#171b29;
color:white;
padding:20px;
border-radius:20px;
box-shadow:0 20px 60px #0009;
}

.hidden{display:none}

.item{
display:flex;
justify-content:space-between;
align-items:center;
background:#ffffff12;
padding:12px;
margin:8px 0;
border-radius:12px;
}

.close{
width:100%;
margin-top:10px;
}

@media(min-width:800px){
#joystick,#buttons{display:none}
}

@media(max-width:799px){
#help{display:none}
}
</style>
</head>

<body>

<div id="ui">
<div id="top">

<div class="pill">
💰 <span id="coins">500</span>
</div>

<div class="pill">
🏠 Lv.<span id="level">1</span>
</div>

<button id="lock">
🔒 LOCK
</button>

</div>

<div id="msg"></div>
</div>

<div id="hint"></div>

<div id="controls">

<div id="joystick">
<div id="stick"></div>
</div>

<div id="buttons">
<button id="jump">⬆️</button>
<button id="interact">✋</button>
<button id="collectionButton">🧸</button>
</div>

</div>

<div id="help">
WASD = Move • Mouse = Look • E = Steal • Space = Jump
</div>

<div id="shopPanel" class="panel hidden">
<h2>🛒 Squishy Shop</h2>
<div id="shop"></div>
<button class="close" onclick="closeShop()">Close</button>
</div>

<div id="collectionPanel" class="panel hidden">
<h2>🧸 My Squishies</h2>
<div id="collection"></div>
<button class="close" onclick="closeCollection()">Close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
GAME DATA
========================= */

const SQUISHIES={

butter:{
name:"Butter Squishy",
price:60,
income:2,
rarity:"Common",
color:0xffd84a,
shape:"butter"
},

needoh:{
name:"NeeDoh Squishy",
price:120,
income:5,
rarity:"Rare",
color:0x69c9ff,
shape:"ball"
},

burger:{
name:"Burger Squishy",
price:300,
income:12,
rarity:"Epic",
color:0xd58a45,
shape:"burger"
},

sprite:{
name:"Sprite Squishy",
price:500,
income:20,
rarity:"Legendary",
color:0x65d889,
shape:"can"
},

cola:{
name:"Coca-Cola Squishy",
price:750,
income:30,
rarity:"Legendary",
color:0xc52f2f,
shape:"cola"
},

pepsi:{
name:"Pepsi Squishy",
price:1000,
income:45,
rarity:"Mythic",
color:0x3575dc,
shape:"pepsi"
}

};


/* =========================
SAVE
========================= */

let save;

try{
save=JSON.parse(localStorage.getItem("squishySave"));
}catch(e){
save=null;
}

if(!save){

save={
coins:500,
level:1,
collection:[],
placed:[],
lockUntil:0
};

}

if(!save.collection)save.collection=[];
if(!save.placed)save.placed=[];

function saveGame(){

localStorage.setItem(
"squishySave",
JSON.stringify(save)
);

}

function updateUI(){

document.getElementById("coins").textContent=
Math.floor(save.coins);

document.getElementById("level").textContent=
save.level;

}


/* =========================
THREE
========================= */

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x87ceeb);

scene.fog=
new THREE.Fog(
0x87ceeb,
35,
120
);

const camera=
new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
.1,
300
);

const renderer=
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
renderer.domElement
);


/* LIGHT */

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x557799,
2
)
);

const sun=
new THREE.DirectionalLight(
0xffffff,
2.5
);

sun.position.set(
20,
40,
15
);

sun.castShadow=true;

scene.add(sun);


/* =========================
MATERIAL
========================= */

function mat(color){

return new THREE.MeshStandardMaterial({
color:color,
roughness:.6
});

}


/* =========================
GROUND
========================= */

const ground=
new THREE.Mesh(
new THREE.PlaneGeometry(
180,
180
),
mat(0x58b957)
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
ROAD
========================= */

function box(
w,h,d,c,x,y,z
){

const m=
new THREE.Mesh(
new THREE.BoxGeometry(
w,h,d
),
mat(c)
);

m.position.set(
x,y,z
);

m.castShadow=true;
m.receiveShadow=true;

scene.add(m);

return m;

}

box(
180,
.05,
11,
0x40444d,
0,
0,
-8
);

for(
let x=-80;
x<80;
x+=8
){

box(
4,
.06,
.25,
0xf4d35e,
x,
.05,
-8
);

}


/* =========================
BUILDINGS
========================= */

for(
let i=0;
i<35;
i++
){

const side=
Math.random()>.5?1:-1;

const x=
side*(40+Math.random()*35);

const z=
-50+Math.random()*100;

const h=
4+Math.random()*13;

box(
5,
h,
5,
0x8997a6,
x,
h/2,
z
);

}


/* =========================
BASES
========================= */

const bases=[
[-25,8,0x4c7dff,"YOUR BASE"],
[25,8,0xff6666,"NPC BASE"],
[-25,-28,0xa96cff,"NPC BASE"],
[25,-28,0xff9f43,"NPC BASE"]
];

function makeText(text){

const canvas=
document.createElement("canvas");

canvas.width=512;
canvas.height=128;

const ctx=
canvas.getContext("2d");

ctx.fillStyle="white";

ctx.font=
"bold 55px Arial";

ctx.textAlign="center";

ctx.fillText(
text,
256,
75
);

const texture=
new THREE.CanvasTexture(
canvas
);

const sprite=
new THREE.Sprite(
new THREE.SpriteMaterial({
map:texture,
transparent:true
})
);

sprite.scale.set(
7,
1.7,
1
);

return sprite;

}

bases.forEach(b=>{

box(
16,
.6,
13,
b[2],
b[0],
.3,
b[1]
);

const sign=
makeText(b[3]);

sign.position.set(
b[0],
2.7,
b[1]-6.5
);

scene.add(sign);

});


/* =========================
SQUISHY CREATOR
========================= */

function eye(x,y,z){

const e=
new THREE.Mesh(
new THREE.SphereGeometry(
.15,
16,
16
),
mat(0x111111)
);

e.position.set(
x,y,z
);

return e;

}


function createSquishy(type){

const d=
SQUISHIES[type];

const g=
new THREE.Group();

let faceZ=-1;

if(d.shape==="butter"){

const body=
new THREE.Mesh(
new THREE.BoxGeometry(
2.2,
1,
1.4
),
mat(d.color)
);

body.position.y=.65;

g.add(body);

const top=
new THREE.Mesh(
new THREE.BoxGeometry(
1.7,
.1,
1.1
),
mat(0xffefa0)
);

top.position.y=1.18;

g.add(top);

faceZ=-.72;

}


else if(d.shape==="burger"){

const top=
new THREE.Mesh(
new THREE.SphereGeometry(
1.25,
24,
16,
0,
Math.PI*2,
0,
Math.PI/2
),
mat(0xe9a04c)
);

top.scale.set(
1.25,
.65,
1
);

top.position.y=.95;

g.add(top);


const patty=
new THREE.Mesh(
new THREE.BoxGeometry(
2.35,
.42,
1.7
),
mat(0x69351d)
);

patty.position.y=.55;

g.add(patty);


const cheese=
new THREE.Mesh(
new THREE.BoxGeometry(
2.5,
.16,
1.8
),
mat(0xffd13b)
);

cheese.position.y=.79;

g.add(cheese);


const bottom=
new THREE.Mesh(
new THREE.CylinderGeometry(
1.15,
1.15,
.45,
32
),
mat(0xd9813a)
);

bottom.position.y=.32;

g.add(bottom);

faceZ=-1;

}


else if(d.shape==="can"){

const can=
new THREE.Mesh(
new THREE.CylinderGeometry(
.75,
.75,
2.1,
32
),
mat(d.color)
);

can.position.y=1.05;

g.add(can);


const top=
new THREE.Mesh(
new THREE.CylinderGeometry(
.68,
.68,
.08,
32
),
mat(0xc9cdd0)
);

top.position.y=2.12;

g.add(top);


const stripe=
new THREE.Mesh(
new THREE.CylinderGeometry(
.76,
.76,
.15,
32
),
mat(0xffffff)
);

stripe.position.y=1.15;

g.add(stripe);

faceZ=-.76;

}


else{

const ball=
new THREE.Mesh(
new THREE.SphereGeometry(
1.15,
32,
24
),
mat(d.color)
);

ball.position.y=1.05;

g.add(ball);

faceZ=-1;

}


/* FACE */

g.add(
eye(-.34,1.3,faceZ),
eye(.34,1.3,faceZ)
);

const mouth=
new THREE.Mesh(
new THREE.TorusGeometry(
.18,
.045,
8,
20,
Math.PI
),
mat(0x222222)
);

mouth.rotation.x=Math.PI;

mouth.position.set(
0,
.88,
faceZ-.03
);

g.add(mouth);


g.traverse(o=>{

if(o.isMesh){

o.castShadow=true;
o.receiveShadow=true;

}

});

return g;

}


/* =========================
WORLD SQUISHIES
========================= */

const world=[];

function spawn(
type,
x,
z,
owner="wild"
){

const g=
createSquishy(type);

g.position.set(
x,
0,
z
);

scene.add(g);

const s={
group:g,
type:type,
owner:owner,
stolen:false
};

world.push(s);

return s;

}


/* ROAD */

spawn("butter",-10,-8);
spawn("needoh",-5,-8);
spawn("burger",1,-8);
spawn("sprite",7,-8);
spawn("cola",13,-8);
spawn("pepsi",19,-8);


/* NPC BASES */

spawn("butter",21,8,"npc");
spawn("needoh",25,8,"npc");
spawn("burger",29,8,"npc");
spawn("sprite",21,12,"npc");
spawn("cola",25,12,"npc");
spawn("pepsi",29,12,"npc");

spawn("butter",-21,-28,"npc");
spawn("needoh",-25,-28,"npc");
spawn("burger",-29,-28,"npc");

spawn("sprite",21,-28,"npc");
spawn("cola",25,-28,"npc");
spawn("pepsi",29,-28,"npc");


/* =========================
PLAYER
========================= */

const player=
new THREE.Group();

scene.add(player);

const body=
new THREE.Mesh(
new THREE.CapsuleGeometry(
.45,
1.1,
6,
12
),
mat(0x276cff)
);

body.position.y=1.15;

player.add(body);


const head=
new THREE.Mesh(
new THREE.SphereGeometry(
.48,
20,
16
),
mat(0xffc28b)
);

head.position.y=2.05;

player.add(head);

player.position.set(
-25,
0,
14
);


let yaw=0;

let pitch=-.15;

let velocityY=0;

let grounded=true;

const keys={};


addEventListener(
"keydown",
e=>{

keys[e.code]=true;

if(e.code==="KeyE")
interact();

if(e.code==="Space")
jump();

}
);


addEventListener(
"keyup",
e=>{
keys[e.code]=false;
}
);


/* =========================
MOUSE
========================= */

renderer.domElement.addEventListener(
"click",
()=>{

if(innerWidth>=800){

renderer.domElement.requestPointerLock();

}

}
);


addEventListener(
"mousemove",
e=>{

if(
document.pointerLockElement===
renderer.domElement
){

yaw-=
e.movementX*.0025;

pitch-=
e.movementY*.0025;

pitch=
Math.max(
-1.1,
Math.min(.6,pitch)
);

}

}
);


/* =========================
MOBILE JOYSTICK
========================= */

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let joyX=0;
let joyY=0;
let dragging=false;


joystick.addEventListener(
"pointerdown",
e=>{

dragging=true;

joystick.setPointerCapture(
e.pointerId
);

moveJoy(e);

}
);


joystick.addEventListener(
"pointermove",
e=>{

if(dragging)
moveJoy(e);

}
);


joystick.addEventListener(
"pointerup",
resetJoy
);


joystick.addEventListener(
"pointercancel",
resetJoy
);


function moveJoy(e){

const r=
joystick.getBoundingClientRect();

let x=
e.clientX-
(r.left+r.width/2);

let y=
e.clientY-
(r.top+r.height/2);

const max=42;

const d=
Math.hypot(x,y);

if(d>max){

x=x/d*max;
y=y/d*max;

}

joyX=x/max;
joyY=y/max;

stick.style.transform=
`translate(${x}px,${y}px)`;

}


function resetJoy(){

dragging=false;

joyX=0;
joyY=0;

stick.style.transform=
"translate(0,0)";

}


document.getElementById(
"jump"
).onclick=jump;


document.getElementById(
"interact"
).onclick=interact;


/* =========================
JUMP
========================= */

function jump(){

if(grounded){

velocityY=7.5;

grounded=false;

}

}


/* =========================
NEAREST
========================= */

function nearest(){

let closest=null;

let distance=3.5;

world.forEach(s=>{

if(
!s.group.visible ||
s.stolen
)return;

const d=
player.position.distanceTo(
s.group.position
);

if(d<distance){

distance=d;
closest=s;

}

});

return closest;

}


/* =========================
STEAL
========================= */

function interact(){

const s=nearest();

if(s){

const d=
SQUISHIES[s.type];


if(
s.owner==="npc" &&
Date.now()<save.lockUntil
){

showMessage(
"🔒 Your base is locked!"
);

return;

}


s.stolen=true;

s.group.visible=false;

s.owner="player";


if(
!save.collection.includes(
s.type
)
){

save.collection.push(
s.type
);

}


const reward=
Math.floor(d.price*.25);

save.coins+=reward;

save.placed.push({
type:s.type
});

addSquishyToBase(
s.type,
save.placed.length-1
);

saveGame();

updateUI();

showMessage(
"🔥 Stole "+
d.name+
" +"+
reward+
" coins!"
);

return;

}


/* SHOP */

if(
Math.abs(player.position.z+8)<5 &&
player.position.x>-23 &&
player.position.x<23
){

openShop();

return;

}


/* BASE UPGRADE */

const dx=
player.position.x+25;

const dz=
player.position.z-8;

if(
Math.hypot(dx,dz)<9
){

const cost=
save.level*700;

if(save.coins>=cost){

save.coins-=cost;

save.level++;

saveGame();

updateUI();

showMessage(
"🏠 Base upgraded!"
);

}else{

showMessage(
"Need "+cost+" coins"
);

}

}

}


/* =========================
BASE SQUISHY
========================= */

const slots=[
[-29,5],
[-25,5],
[-21,5],
[-29,9],
[-25,9],
[-21,9],
[-29,13],
[-25,13],
[-21,13]
];


function addSquishyToBase(
type,
index
){

const slot=
slots[index%slots.length];

const g=
createSquishy(type);

g.scale.setScalar(.65);

g.position.set(
slot[0],
0,
slot[1]
);

scene.add(g);

}


/* RESTORE */

save.placed.forEach(
(item,index)=>{

if(
SQUISHIES[item.type]
){

addSquishyToBase(
item.type,
index
);

}

}
);


/* =========================
SHOP
========================= */

function openShop(){

document
.getElementById("shopPanel")
.classList.remove("hidden");

const shop=
document.getElementById("shop");

shop.innerHTML="";

Object.entries(
SQUISHIES
).forEach(([id,d])=>{

const row=
document.createElement("div");

row.className="item";

row.innerHTML=`

<div>
<b>${d.name}</b>
<br>
<small>
${d.rarity}
• +${d.income}/sec
</small>
</div>

<button>
💰 ${d.price}
</button>

`;

row.querySelector(
"button"
).onclick=()=>{

if(save.coins<d.price){

showMessage(
"❌ Not enough coins!"
);

return;

}

save.coins-=d.price;

save.collection.push(id);

save.collection=
[...new Set(save.collection)];

save.placed.push({
type:id
});

addSquishyToBase(
id,
save.placed.length-1
);

saveGame();

updateUI();

showMessage(
"🛒 Bought "+
d.name
);

};

shop.appendChild(row);

});

}


function closeShop(){

document
.getElementById("shopPanel")
.classList.add("hidden");

}


/* =========================
COLLECTION
========================= */

function openCollection(){

const panel=
document.getElementById(
"collectionPanel"
);

panel.classList.remove(
"hidden"
);

const list=
document.getElementById(
"collection"
);

list.innerHTML="";

if(save.collection.length===0){

list.innerHTML=
"<p>No squishies yet!</p>";

return;

}

save.collection.forEach(
id=>{

const d=SQUISHIES[id];

const row=
document.createElement("div");

row.className="item";

row.innerHTML=`

<b>🧸 ${d.name}</b>

<span>
${d.rarity}
<br>
+${d.income}/sec
</span>

`;

list.appendChild(row);

});

}


function closeCollection(){

document
.getElementById(
"collectionPanel"
)
.classList.add(
"hidden"
);

}


document.getElementById(
"collectionButton"
).onclick=
openCollection;


/* =========================
LOCK
========================= */

document.getElementById(
"lock"
).onclick=()=>{

if(
Date.now()<save.lockUntil
){

showMessage(
"🔒 Already locked!"
);

return;

}

save.lockUntil=
Date.now()+15000;

saveGame();

showMessage(
"🔒 BASE LOCKED FOR 15 SECONDS!"
);

};


setInterval(()=>{

const button=
document.getElementById(
"lock"
);

if(
Date.now()<save.lockUntil
){

button.textContent=
"🔒 "+
Math.ceil(
(save.lockUntil-Date.now())/1000
)+"s";

}else{

button.textContent=
"🔒 LOCK";

}

},100);


/* =========================
PASSIVE MONEY
========================= */

setInterval(()=>{

let income=0;

save.placed.forEach(
item=>{

if(
SQUISHIES[item.type]
){

income+=
SQUISHIES[item.type].income;

}

});

save.coins+=income;

saveGame();

updateUI();

},1000);


/* =========================
MOVEMENT
========================= */

const clock=
new THREE.Clock();


function updatePlayer(dt){

let forward=
(keys.KeyW?1:0)-
(keys.KeyS?1:0)-
joyY;

let right=
(keys.KeyD?1:0)-
(keys.KeyA?1:0)+
joyX;


const length=
Math.hypot(
forward,
right
);

if(length>1){

forward/=length;
right/=length;

}


const speed=7;


const forwardVector=
new THREE.Vector3(
Math.sin(yaw),
0,
Math.cos(yaw)
);


const rightVector=
new THREE.Vector3(
Math.cos(yaw),
0,
-Math.sin(yaw)
);


player.position.addScaledVector(
forwardVector,
forward*speed*dt
);


player.position.addScaledVector(
rightVector,
right*speed*dt
);


/* LIMIT */

player.position.x=
Math.max(
-80,
Math.min(
80,
player.position.x
)
);

player.position.z=
Math.max(
-60,
Math.min(
60,
player.position.z
)
);


/* GRAVITY */

velocityY-=20*dt;

player.position.y+=
velocityY*dt;


if(
player.position.y<=0
){

player.position.y=0;

velocityY=0;

grounded=true;

}


/* CAMERA */

const target=
new THREE.Vector3(
player.position.x,
player.position.y+1.6,
player.position.z
);

const dist=7;

const desired=
target.clone().add(
new THREE.Vector3(
-Math.sin(yaw)*dist,
3.4-pitch*2,
-Math.cos(yaw)*dist
)
);

camera.position.lerp(
desired,
1-Math.pow(.001,dt)
);

camera.lookAt(target);

}


/* =========================
HINT
========================= */

function updateHint(){

const s=nearest();

const hint=
document.getElementById(
"hint"
);

if(s){

hint.style.display=
"block";

hint.textContent=
"✋ STEAL "+
SQUISHIES[s.type].name;

}else{

hint.style.display=
"none";

}

}


/* =========================
MESSAGE
========================= */

function showMessage(text){

const m=
document.getElementById(
"msg"
);

m.textContent=text;

m.classList.add("show");

clearTimeout(m.timer);

m.timer=
setTimeout(
()=>{
m.classList.remove("show");
},
2000
);

}


/* =========================
ANIMATION
========================= */

function animate(){

requestAnimationFrame(
animate
);

const dt=
Math.min(
clock.getDelta(),
.05
);

updatePlayer(dt);

updateHint();


const time=
performance.now()*.001;


world.forEach(
(s,i)=>{

if(!s.group.visible)
return;

const wave=
Math.sin(
time*4+i
);

s.group.scale.y=
1-
Math.abs(wave)*.08;

s.group.scale.x=
1+
Math.abs(wave)*.04;

s.group.scale.z=
1+
Math.abs(wave)*.04;

s.group.rotation.y+=
dt*.25;

});


renderer.render(
scene,
camera
);

}


animate();


/* =========================
RESIZE
========================= */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});


/* =========================
START
========================= */

updateUI();

setTimeout(
()=>{

showMessage(
"🧸 Find a squishy and steal it!"
);

},
700
);

</script>

</body>
</html>
