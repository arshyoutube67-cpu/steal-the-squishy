<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Steal a Squishy 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8ed8ff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

button{

}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
}

.pill,
.action{
  background:rgba(15,20,35,.88);
  color:white;
  border:2px solid rgba(255,255,255,.25);
  border-radius:14px;
  padding:9px 13px;
  font-weight:800;
  box-shadow:0 4px 15px #0005;
}

.action{
  pointer-events:auto;
  border:none;
}

#message{
  position:absolute;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(15,20,35,.92);
  color:white;
  padding:10px 16px;
  border-radius:12px;
  opacity:0;
  transition:.2s;
  font-weight:700;
  white-space:nowrap;
}

#message.show{
  opacity:1;
}

.panel{
  position:fixed;
  z-index:30;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(92vw,520px);
  max-height:82vh;
  overflow:auto;
  background:rgba(20,24,40,.97);
  color:white;
  border:2px solid #ffffff33;
  border-radius:20px;
  padding:18px;
  box-shadow:0 20px 70px #0008;
}

.hidden{
  display:none;
}

.panel h2{
  margin:0 0 12px;
}

.shopItem,
.collectionItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  margin:8px 0;
  background:#ffffff12;
  border-radius:14px;
}

.shopItem button{
  padding:9px 12px;
  border:0;
  border-radius:10px;
  font-weight:800;
}

.close{
  width:100%;
  padding:12px;
  border:0;
  border-radius:12px;
  font-weight:800;
  margin-top:10px;
}

#controls{
  position:fixed;
  z-index:15;
  inset:0;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:20px;
  bottom:24px;
  width:130px;
  height:130px;

  background:#ffffff25;
  border:2px solid #ffffff55;

}

#stick{
  position:absolute;

  top:34px;

#rightButtons{

#rightButtons button{

  height:66px;
  border:0;

#crosshair{

@media(min-width:800px){

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================================================
   STEAL A SQUISHY 3D
   ONE-FILE VERSION
========================================================= */


/* =========================
   THREE.JS SETUP
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8ed8ff);

scene.fog = new THREE.Fog(
  0x8ed8ff,
  35,
  120
);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  250
);

camera.position.set(0,5,14);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHTING
========================= */

const hemi =
  new THREE.HemisphereLight(
    0xffffff,
    0x557799,
    2
  );

scene.add(hemi);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2.5
  );

sun.position.set(
  20,
  35,
  10
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  2048,
  2048
);

scene.add(sun);

   UI
========================= */

const shopList =

const collection =

  messageEl.textContent=text;

  messageEl.classList.add("show");

  clearTimeout(message.timer);

  message.timer=setTimeout(()=>{
    messageEl.classList.remove("show");
  },1800);
}

   GAME DATA

/* =========================
   SAVE SYSTEM
========================= */

let save;

try{

  save =
    JSON.parse(

    );

}catch(e){

  save=null;

}

    placed:[],

  };

}

  localStorage.setItem(

/* =========================
   WORLD HELPERS
========================= */

function material(color){

  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:.65,
    metalness:.02
  });

}


function makeBox(
  width,
  height,
  depth,
  color,
  x,
  y,
  z
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      material(color)
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;

}


function makeCylinder(
  radius,
  height,
  color,
  x,
  y,
  z
){

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        height,
        32
      ),
      material(color)
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;

}


/* =========================
   GROUND
========================= */

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      180,
      180
    ),
    material(0x5bb85b)
  );

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   ROAD
========================= */

makeBox(
  180,
  .05,
  11,
  0x3f4650,
  0,
  0,
  -8
);

for(
  let x=-80;
  x<80;
  x+=8
){

  makeBox(
    4,
    .06,
    .25,
    0xf2d35e,
    x,
    .05,
    -8
  );

/* =========================
   BUILDINGS
========================= */

for(
  let i=0;
  i<38;
  i++
){

  const side =
    Math.random()>0.5
    ? 1
    : -1;

  const x =
    side *
    (40 + Math.random()*35);

  const z =
    -50 + Math.random()*100;

  const height =
    4 + Math.random()*12;

  makeBox(
    4+Math.random()*5,
    height,
    4+Math.random()*5,
    0x8998a8,
    x,
    height/2,
    z
  );

}


/* =========================
   TEXT SPRITES
========================= */

function textSprite(text){

  const canvas =
    document.createElement("canvas");

  canvas.width=512;
  canvas.height=128;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle="white";

  ctx.font=
    "bold 55px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    text,
    256,
    75
  );

  const texture =
    new THREE.CanvasTexture(canvas);

  const sprite =
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:texture,
        transparent:true
      })
    );

  sprite.scale.set(
    7,
    1.75,
    1
  );

  return sprite;

}


/* =========================
   BASES
========================= */

const bases=[];


function createBase(
  x,
  z,
  color,
  name
){

  const floor =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        16,
        .6,
        13
      ),
      material(color)
    );

  floor.position.set(
    x,
    .3,
    z
  );

  floor.receiveShadow=true;

  scene.add(floor);


  const sign =
    textSprite(name);

  sign.position.set(
    x,
    2.7,
    z-6.5
  );

  scene.add(sign);


  bases.push({
    x:x,
    z:z,
    locked:false
  });

}


createBase(

createBase(

/* =========================
   SQUISHY FACE
========================= */

function makeEye(
  x,
  y,
  z,
  size=.16
){

  const eye =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        size,
        16,
        16
      ),
      material(0x111111)
    );

  eye.position.set(
    x,y,z
  );

  return eye;

}


/* =========================
   CREATE 3D SQUISHY
========================= */

function createSquishy(type){

  const data=TYPES[type];

  const group=
    new THREE.Group();

  group.userData.type=type;

  let faceZ=-1.05;


  /* BUTTER */

  if(data.shape==="butter"){

    const body =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.2,
          1,
          1.4
        ),
        material(data.color)
      );

    body.position.y=.65;

    group.add(body);


    const top =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.7,
          .1,
          1.1
        ),
        material(0xffef9b)
      );

    top.position.y=1.18;

    group.add(top);

  }


  /* BURGER */

  else if(data.shape==="burger"){

    const bunTop =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          1.25,
          24,
          16,
          0,
          Math.PI*2,
          0,
          Math.PI/2
        ),
        material(0xe9a04c)
      );

    bunTop.scale.set(
      1.25,
      .65,
      1
    );

    bunTop.position.y=.95;

    group.add(bunTop);


    const patty =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.35,
          .42,
          1.7
        ),
        material(0x673218)
      );

    patty.position.y=.57;

    group.add(patty);


    const cheese =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.5,
          .16,
          1.8
        ),
        material(0xffd13b)
      );

    cheese.position.y=.79;

    group.add(cheese);


    const bottom =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          1.15,
          1.15,
          .45,
          32
        ),
        material(0xd9813a)
      );

    bottom.position.y=.32;

    group.add(bottom);

    faceZ=-1.02;

  }


  /* DRINK CANS */

  else if(data.shape==="can"){

    const can =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .75,
          .75,
          2.1,
          32
        ),
        material(data.color)
      );

    can.position.y=1.05;

    group.add(can);


    const top =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .68,
          .68,
          .08,
          32
        ),
        material(0xc9cdd0)
      );

    top.position.y=2.12;

    group.add(top);


    const stripe =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .76,
          .76,
          .15,
          32
        ),
        material(0xffffff)
      );

    stripe.position.y=1.15;

    group.add(stripe);

    faceZ=-.77;

  }


  /* NEEDOH */

  else{

    const body =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          1.15,
          32,
          24
        ),
        material(data.color)
      );

    body.scale.set(
      1,
      1.03,
      .95
    );

    body.position.y=1.05;

    group.add(body);

    faceZ=-1.02;

  }


  /* FACE */

  const eye1=
    makeEye(
      -.34,
      1.3,
      faceZ
    );

  const eye2=
    makeEye(
      .34,
      1.3,
      faceZ
    );

  group.add(
    eye1,
    eye2
  );


  const mouth =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .18,
        .045,
        8,
        20,
        Math.PI
      ),
      material(0x222222)
    );

  mouth.rotation.x=Math.PI;

  mouth.position.set(
    0,
    .88,
    faceZ-.03
  );

  group.add(mouth);


  group.traverse(
    object=>{

      if(object.isMesh){

        object.castShadow=true;
        object.receiveShadow=true;

      }

    }
  );


  return group;

}


/* =========================
   WORLD SQUISHIES
========================= */

const worldSquishies=[];


function addWorldSquishy(
  type,
  x,
  z,
  owner="wild"
){

  const group=
    createSquishy(type);

  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);


  const squishy={
    group:group,
    type:type,
    owner:owner,
    stolen:false,
    homeX:x,
    homeZ:z
  };


  worldSquishies.push(
    squishy
  );

  return squishy;

}

/* =========================
   PLAYER CONTROL
========================= */

let yaw=0;

let pitch=-.15;

let verticalVelocity=0;

let onGround=true;

const keys={};


addEventListener(
  "keydown",
  event=>{

    keys[event.code]=true;

    if(event.code==="KeyE")
      interact();

    if(event.code==="Space")
      jump();

  }
);


addEventListener(
  "keyup",
  event=>{
    keys[event.code]=false;
  }
);


/* =========================
   MOUSE LOOK
========================= */

renderer.domElement.addEventListener(
  "click",
  ()=>{

    if(innerWidth>=800){

      renderer.domElement.requestPointerLock();

    }

  }
);


addEventListener(
  "mousemove",
  event=>{

    if(
      document.pointerLockElement===
      renderer.domElement
    ){

      yaw-=event.movementX*.0025;

      pitch-=event.movementY*.0025;

      pitch=Math.max(
        -1.1,
        Math.min(.6,pitch)
      );

    }

  }
);


/* =========================
   MOBILE JOYSTICK
========================= */

const joystick=
  document.getElementById(
    "joystick"
  );

const stick=
  document.getElementById(
    "stick"
  );

let joystickX=0;

let joystickY=0;

let joystickDragging=false;


joystick.addEventListener(
  "pointerdown",
  event=>{

    joystickDragging=true;

    joystick.setPointerCapture(
      event.pointerId
    );

    moveJoystick(event);

  }
);


joystick.addEventListener(
  "pointermove",
  event=>{

    if(joystickDragging)
      moveJoystick(event);

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


function moveJoystick(event){

  const rect=
    joystick.getBoundingClientRect();

  const centerX=
    rect.left+
    rect.width/2;

  const centerY=
    rect.top+
    rect.height/2;

  let x=
    event.clientX-centerX;

  let y=
    event.clientY-centerY;

  const max=42;

  const distance=
    Math.hypot(x,y);

  if(distance>max){

    x=x/distance*max;

    y=y/distance*max;

  }

  joystickX=x/max;

  joystickY=y/max;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

}


function resetJoystick(){

  joystickDragging=false;

  joystickX=0;

  joystickY=0;

  stick.style.transform=
    "translate(0,0)";

}


/* =========================
   JUMP
========================= */

function jump(){

  if(onGround){

    verticalVelocity=7.5;

    onGround=false;

  }

}


document.getElementById(
  "jump"
).onclick=jump;


/* =========================
   FIND NEAREST SQUISHY
========================= */

function nearestSquishy(){

  let closest=null;

  let distance=3.4;

  for(
    const squishy
    of worldSquishies
  ){

    if(
      !squishy.group.visible ||
      squishy.stolen
    )
      continue;

    const d=
      player.position.distanceTo(
        squishy.group.position
      );

    if(d<distance){

      distance=d;

      closest=squishy;

    }

  }

  return closest;

}


/* =========================
   INTERACT
========================= */

function interact(){

  const squishy=
    nearestSquishy();


  if(squishy){

    const data=
      TYPES[squishy.type];


    if(
      squishy.owner==="npc" &&
      Date.now()<save.lockUntil
    ){

      message(
        "🔒 Your base is locked!"
      );

      return;

    }


    squishy.owner="player";

    squishy.stolen=true;

    squishy.group.visible=false;


    if(
      !save.collection.includes(
        squishy.type
      )
    ){

      save.collection.push(
        squishy.type
      );

    }


    const reward=
      Math.floor(
        data.price*.25
      );


    save.coins+=reward;


    addSquishyToBase(
      squishy.type
    );


    save.placed.push({
      type:squishy.type
    });


    saveGame();

    updateUI();


    message(
      "🔥 Stole "+
      data.name+
      "! +"+
      reward+
      " coins"
    );

    return;

  }


  /* SHOP */

  if(
    Math.abs(player.position.z+8)<5 &&
    player.position.x>-23 &&
    player.position.x<23
  ){

    shop.classList.remove(
      "hidden"
    );

    renderShop();

    return;

  }


  /* BASE UPGRADE */

  if(
    distanceToBase(
      bases[0]
    )<9
  ){

    const cost=
      save.baseLevel*700;


    if(
      save.coins>=cost
    ){

      save.coins-=cost;

      save.baseLevel++;

      saveGame();

      updateUI();

      message(
        "🏠 Base upgraded!"
      );

    }else{

      message(
        "Need "+
        cost+
        " coins"
      );

    }

  }

}


/* =========================
   BASE DISTANCE
========================= */

function distanceToBase(base){

  return Math.hypot(
    player.position.x-base.x,
    player.position.z-base.z
  );

}


/* =========================
   PLACE SQUISHY
========================= */

const baseSlots=[
  [-29,5],
  [-25,5],
  [-21,5],
  [-29,9],
  [-25,9],
  [-21,9],
  [-29,13],
  [-25,13],
  [-21,13]
];


function addSquishyToBase(
  type,
  slotIndex=save.placed.length
){

  const slot=
    baseSlots[
      slotIndex%baseSlots.length
    ];

  const squishy=
    createSquishy(type);

  squishy.scale.setScalar(.65);

  squishy.position.set(
    slot[0],
    0,
    slot[1]
  );

  scene.add(squishy);

}


/* =========================
   RESTORE PLAYER BASE
========================= */

save.placed.forEach(
  (item,index)=>{

    if(TYPES[item.type]){

      addSquishyToBase(
        item.type,
        index
      );

    }

  }
);


/* =========================
   SHOP
========================= */

function renderShop(){

  shopList.innerHTML="";


  for(
    const [id,data]
    of Object.entries(TYPES)
  ){

    const row=
      document.createElement("div");

    row.className="shopItem";


    row.innerHTML=`
      <div>
        <b>${data.name}</b>
        <br>
        <small>
          ${data.rarity}
          • +${data.income}/sec
        </small>
      </div>

      <button>
        💰 ${data.price}
      </button>
    `;


    row.querySelector(
      "button"
    ).onclick=()=>{

      if(
        save.coins<data.price
      ){

        message(
          "❌ Not enough coins!"
        );

        return;

      }


      save.coins-=data.price;


      if(
        !save.collection.includes(id)
      ){

        save.collection.push(id);

      }


      save.placed.push({
        type:id
      });


      addSquishyToBase(
        id,
        save.placed.length-1
      );


      saveGame();

      updateUI();

      message(
        "🛒 Bought "+
        data.name
      );

    };


    shopList.appendChild(row);

  }

}


document.getElementById(
  "closeShop"
).onclick=()=>{

  shop.classList.add(
    "hidden"
  );

};


/* =========================
   COLLECTION
========================= */

function renderCollection(){

  collection.innerHTML="";


  if(
    save.collection.length===0
  ){

    collection.innerHTML=
      "<p>You don't have any squishies yet!</p>";

    return;

  }


  save.collection.forEach(
    id=>{

      const data=TYPES[id];

      const item=
        document.createElement("div");

      item.className=
        "collectionItem";


      item.innerHTML=`
        <span>
          🧸 <b>${data.name}</b>
        </span>

        <span>
          ${data.rarity}
          <br>
          +${data.income}/sec
        </span>
      `;


      collection.appendChild(item);

    }
  );

}


document.getElementById(
  "collectionButton"
).onclick=()=>{

  renderCollection();

  collectionPanel.classList.remove(
    "hidden"
  );

};


document.getElementById(
  "closeCollection"
).onclick=()=>{

  collectionPanel.classList.add(
    "hidden"
  );

};


document.getElementById(
  "interact"
).onclick=interact;


/* =========================
   BASE LOCK
========================= */

lockBtn.onclick=()=>{

  if(
    Date.now()<save.lockUntil
  ){

    message(
      "🔒 Already locked!"
    );

    return;

  }


  save.lockUntil=
    Date.now()+15000;


  saveGame();


  message(
    "🔒 Base locked for 15 seconds!"
  );

};


setInterval(
  ()=>{

    if(
      Date.now()<save.lockUntil
    ){

      lockTimer.textContent=
        Math.ceil(
          (save.lockUntil-Date.now())
          /1000
        )+"s";

    }else{

      lockTimer.textContent="";

    }

  },
  100
);


/* =========================
   PASSIVE INCOME
========================= */

setInterval(
  ()=>{

    let income=0;


    save.placed.forEach(
      item=>{

        if(TYPES[item.type]){

          income+=
            TYPES[item.type].income;

        }

      }
    );


    save.coins+=income;


    saveGame();

    updateUI();

  },
  1000
);


/* =========================
   PLAYER MOVEMENT
========================= */

const clock=
  new THREE.Clock();


function updatePlayer(delta){

  let forward=
    (keys.KeyW?1:0)-
    (keys.KeyS?1:0)-
    joystickY;


  let right=
    (keys.KeyD?1:0)-
    (keys.KeyA?1:0)+
    joystickX;


  const length=
    Math.hypot(
      forward,
      right
    );


  if(length>1){

    forward/=length;

    right/=length;

  }


  const speed=7;


  const forwardVector=
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      Math.cos(yaw)
    );


  const rightVector=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  player.position.addScaledVector(
    forwardVector,
    forward*speed*delta
  );


  player.position.addScaledVector(
    rightVector,
    right*speed*delta
  );


  /* MAP LIMITS */

  player.position.x=
    Math.max(
      -80,
      Math.min(
        80,
        player.position.x
      )
    );


  player.position.z=
    Math.max(
      -60,
      Math.min(
        60,
        player.position.z
      )
    );


  /* GRAVITY */

  verticalVelocity-=
    20*delta;


  player.position.y+=
    verticalVelocity*delta;


  if(
    player.position.y<=0
  ){

    player.position.y=0;

    verticalVelocity=0;

    onGround=true;

  }


  /* CAMERA */

  const target=
    new THREE.Vector3(
      player.position.x,
      player.position.y+1.6,
      player.position.z
    );


  const cameraDistance=7;


  const desired=
    target.clone().add(
      new THREE.Vector3(
        -Math.sin(yaw)*cameraDistance,
        3.3-pitch*2,
        -Math.cos(yaw)*cameraDistance
      )
    );


  camera.position.lerp(
    desired,
    1-Math.pow(.001,delta)
  );


  camera.lookAt(target);

}


/* =========================
   INTERACTION HINT
========================= */

function updateHint(){

  const squishy=
    nearestSquishy();


  if(squishy){

    const data=
      TYPES[squishy.type];


    interactHint.style.display=
      "block";


    interactHint.textContent=
      "✋ STEAL "+
      data.name;

  }else{

    interactHint.style.display=
      "none";

  }

}


/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );


  updatePlayer(delta);

  updateHint();


  const time=
    performance.now()*.001;


  worldSquishies.forEach(
    (squishy,index)=>{

      if(
        squishy.group.visible
      ){

        /* Squish animation */

        const wave=
          Math.sin(
            time*4+index
          );


        squishy.group.scale.x=
          .98+
          Math.abs(wave)*.04;


        squishy.group.scale.y=
          1-
          Math.abs(wave)*.08;


        squishy.group.scale.z=
          .98+
          Math.abs(wave)*.04;


        squishy.group.rotation.y+=
          delta*.25;

      }

    }
  );


  renderer.render(
    scene,
    camera
  );

}


animate();


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================
   START
========================= */

updateUI();

setTimeout(
  ()=>{

    message(
      "🧸 Find a squishy and press E / ✋ to steal it!"
    );

  },
  800
);

</script>
